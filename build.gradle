buildscript {
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:3.1.2'
        classpath 'com.f2prateek.checkstyle:checkstyle:1.0.1'
    }
}

apply plugin: 'com.android.library'
apply plugin: 'checkstyle'
apply plugin: 'com.f2prateek.checkstyle'

android {
    compileSdkVersion 27
    buildToolsVersion '27.0.3'

    defaultConfig {
        minSdkVersion 14
        targetSdkVersion 27
        compileSdkVersion 27
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_7
        targetCompatibility JavaVersion.VERSION_1_7
    }
}

checkstyle {
    configFile rootProject.file('gradle/checkstyle.xml')
}

dependencies {
    repositories {
        google()
        jcenter()
        mavenCentral()
    }

    compileOnly 'com.segment.analytics.android:analytics:4.3.1'

    implementation 'com.google.android.gms:play-services-analytics:15.0.2'

    testImplementation 'junit:junit:4.12'
    testImplementation('org.robolectric:robolectric:3.0') {
        exclude group: 'commons-logging', module: 'commons-logging'
        exclude group: 'org.apache.httpcomponents', module: 'httpclient'
    }

    testImplementation 'com.segment.analytics.android:analytics-tests:4.0.0'

    testImplementation 'org.assertj:assertj-core:1.7.1'

    testImplementation 'org.mockito:mockito-core:2.18.0'
}

apply from: rootProject.file('gradle/gradle-mvn-push.gradle')
